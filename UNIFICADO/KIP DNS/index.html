<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Dados Operacionais</title>

    <!-- Biblioteca externa para ler Excel/CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Fontes Google -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Estilos CSS em arquivo separado -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="brand">
            KIP DADOS
            <span class="brand-badge">REGISTRO</span>
        </div>
    </header>

    <div class="layout-main">

        <aside>
            <div class="sidebar-title">Base de Dados</div>

            <div class="form-group">
                <label for="docSelect">Base Ativa</label>
                <select id="docSelect" onchange="buscar()"></select>
            </div>

            <button class="btn btn-outline-danger" onclick="excluirBaseAtual()">Excluir Base Ativa</button>

            <hr class="sidebar-divider">

            <div class="sidebar-title">Importar Planilha</div>

            <div class="form-group">
                <label for="docName">Nome da Base</label>
                <input type="text" id="docName" placeholder="Ex: Clientes_2026">
            </div>

            <div class="form-group">
                <label>Arquivo (.xlsx / .csv)</label>
                <div class="file-dropzone">
                    <span class="file-label-text" id="fileLabel">📁 Selecionar Ficheiro</span>
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="atualizarNomeArquivo(this)">
                </div>
            </div>

            <button class="btn" onclick="importarPlanilha()">Subir Planilha</button>
            <button class="btn"><a href="../index.html" class="btn"> Voltar</a></button>
        </aside>

        <main>
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" oninput="buscar()"
                    placeholder="Pesquisar por Código, Nome, DNS, Senha...">
            </div>

            <div class="counter">REGISTROS LOCALIZADOS: <span id="totalCount">0</span></div>

            <div id="resultsContainer" class="data-grid"></div>
        </main>

    </div>

    <!-- Lógica JavaScript em arquivo separado -->
    <script src="script.js"></script>
</body>

</html>
